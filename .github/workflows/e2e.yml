# Virtual test setup: integration and e2e suites (FSD §17.1, §17.2).
name: e2e

on:
  push:
    branches: [booth]
  workflow_dispatch:

jobs:
  virtual-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: photobooth
          submodules: true
      - name: Pinned photobooth-setup commit
        id: setup
        run: echo "ref=$(cat photobooth/testing/setup-ref)" >> "$GITHUB_OUTPUT"
      - name: Check the photobooth-setup token
        env:
          TOKEN: ${{ secrets.SETUP_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret SETUP_REPO_TOKEN missing: a fine-grained, read-only token on photobooth-setup (R13)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: starkerflamingo32/photobooth-setup
          ref: ${{ steps.setup.outputs.ref }}
          token: ${{ secrets.SETUP_REPO_TOKEN }}
          path: photobooth-setup
          persist-credentials: false
      - name: Integration suite
        working-directory: photobooth
        env:
          SETUP_DIR: ${{ github.workspace }}/photobooth-setup
        run: testing/run.sh test integration
      - name: E2E suite
        if: always()
        working-directory: photobooth
        env:
          SETUP_DIR: ${{ github.workspace }}/photobooth-setup
        run: testing/run.sh test e2e
      - name: Summary
        if: always()
        working-directory: photobooth
        run: |
          pip install pyyaml==6.0.2 >/dev/null
          python3 testing/tools/summary.py test-results >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: photobooth/test-results/
          retention-days: 30
